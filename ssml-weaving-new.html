<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1b2430">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SSML Weaving">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<title>SSML Weaving</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b2430;
    --ink-soft:#4a5568;
    --canvas:#f2efe6;
    --panel:#ffffff;
    --gold:#c68a2e;
    --gold-deep:#a06f1f;
    --teal:#2f6f62;
    --teal-soft:#e4efec;
    --rust:#b5652f;
    --rust-soft:#f7ece1;
    --indigo:#3b5bab;
    --indigo-soft:#e7ecf7;
    --red:#b23b30;
    --red-soft:#f7e6e3;
    --line:#ddd7c6;
    --line-soft:#eae6d8;
    --shadow: 0 1px 2px rgba(27,36,48,.06), 0 6px 16px rgba(27,36,48,.06);
    /* plant theme — overridden per plant via JS, this is the default (Saily) */
    --accent:#c68a2e;
    --accent-deep:#a06f1f;
    --accent-soft:#fbf3e4;
    --accent-rgb:198,138,46;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--canvas);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  h1,h2,h3{font-family:'Space Grotesk',sans-serif; margin:0; letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit;}

  #app{max-width:640px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; background:var(--canvas);}
  @media(min-width:900px){ #app{max-width:920px;} }
  /* wide = full-page reports: edge-to-edge at every screen size */
  #app.wide{max-width:100%;}
  #app.wide main{max-width:none; width:100%; padding-left:20px; padding-right:20px;}
  #app.wide .table-wrap{max-height:max(320px, calc(100vh - 300px));}
  #app.wide .gantt-scroll{max-height:max(320px, calc(100vh - 270px));}

  /* sticky header block (top bar + report tabs) */
  .sticky-head{position:sticky; top:0; z-index:30;}
  .sticky-head .topbar{position:static;}
  .report-tabs{
    display:flex; gap:6px; overflow-x:auto; padding:8px 14px; background:#fff;
    border-bottom:1px solid var(--line); scrollbar-width:thin; -webkit-overflow-scrolling:touch;
  }
  .rtab{
    flex-shrink:0; border:1.5px solid var(--line); background:#fbfaf6; color:var(--ink-soft);
    padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:600; white-space:nowrap;
  }
  .rtab:hover{border-color:var(--accent); color:var(--ink);}
  .rtab.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .rtab.warp.active{background:var(--teal); border-color:var(--teal);}

  /* Top bar */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--ink); color:#fff;
    padding:14px 16px calc(14px + env(safe-area-inset-top,0px));
    padding-top:calc(14px + env(safe-area-inset-top,0px));
    display:flex; align-items:center; gap:12px;
  }
  .topbar .back{
    background:rgba(255,255,255,.1); border:none; color:#fff; width:34px; height:34px;
    border-radius:8px; font-size:18px; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .topbar .titles{flex:1; min-width:0;}
  .topbar{border-bottom:3px solid var(--accent);}
  .topbar .brand{font-size:11px; letter-spacing:.14em; color:var(--accent); font-weight:600; text-transform:uppercase;}
  .topbar .brand .ver{color:#8b95a3; letter-spacing:.02em; font-weight:500; text-transform:none; margin-left:6px;}
  .topbar h1{font-size:19px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .topbar-actions{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .topbar .gearbtn{
    background:rgba(255,255,255,.1); border:none; color:#cfd6df; width:34px; height:34px;
    border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .topbar .userchip{
    font-size:11px; color:#cfd6df; background:rgba(255,255,255,.08);
    padding:6px 10px; border-radius:999px; flex-shrink:0; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    border:none; text-align:left;
  }

  main{flex:1; padding:16px 16px 40px;}

  /* Home / plant hero */
  .home-hero{padding:6px 2px 18px;}
  .home-hero .eyebrow{font-size:11px; letter-spacing:.14em; color:var(--gold-deep); text-transform:uppercase; font-weight:600;}
  .home-hero h1{font-size:28px; margin-top:6px; line-height:1.15;}
  .home-hero p{color:var(--ink-soft); font-size:14.5px; margin-top:8px; line-height:1.5;}

  .menu-grid{display:grid; grid-template-columns:1fr; gap:14px;}
  @media(min-width:560px){.menu-grid{grid-template-columns:1fr 1fr;}}
  @media(min-width:860px){.menu-grid.cols-3{grid-template-columns:1fr 1fr 1fr;}}

  .menu-card{
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:22px 20px; text-align:left; position:relative; overflow:hidden;
    box-shadow:var(--shadow); min-height:150px; display:flex; flex-direction:column; justify-content:space-between;
  }
  .menu-card .tag{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); font-weight:600;}
  .menu-card h2{font-size:24px; margin-top:6px;}
  .menu-card .count{margin-top:14px; font-size:13px; color:var(--ink-soft);}
  .menu-card .count b{color:var(--ink); font-family:'IBM Plex Mono',monospace;}
  .menu-card::after{
    content:''; position:absolute; right:-30px; bottom:-30px; width:110px; height:110px; border-radius:50%;
    background:var(--accent); opacity:.10;
  }
  .menu-card.warp::after{background:var(--teal);}
  .menu-card.plant-SAILY::after{background:var(--gold);}
  .menu-card.plant-J177::after{background:var(--indigo);}
  .menu-card.plant-E125::after{background:var(--rust);}
  .menu-card .rangebits{margin-top:12px; display:flex; flex-wrap:wrap; gap:6px;}
  .menu-card .rangebits span{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft);
    background:#f7f4ea; border:1px solid var(--line-soft); border-radius:6px; padding:3px 7px;
  }

  /* Submenu list */
  .list{display:flex; flex-direction:column; gap:10px;}
  .list-item{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:16px 16px; display:flex; align-items:center; gap:14px; text-align:left;
    box-shadow:var(--shadow); border-left:4px solid var(--accent);
  }
  .list-item.warp{border-left-color:var(--teal);}
  .list-item .letter{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; color:var(--accent-deep);
    background:var(--accent-soft); border-radius:8px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .list-item.warp .letter{color:var(--teal); background:var(--teal-soft);}
  .list-item .txt{flex:1;}
  .list-item .txt .title{font-weight:600; font-size:15px;}
  .list-item .txt .sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .list-item .chev{color:#c7c1ac; font-size:18px;}

  /* Form */
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:18px; box-shadow:var(--shadow); margin-bottom:14px;
  }
  .card h3{font-size:16px; margin-bottom:4px;}
  .card .desc{font-size:13px; color:var(--ink-soft); margin-bottom:14px; line-height:1.5;}
  .field{margin-bottom:14px;}
  .field label{
    display:block; font-size:12px; font-weight:600; color:var(--ink-soft);
    margin-bottom:6px; letter-spacing:.02em;
  }
  .field .hint{font-size:11.5px; color:#9a917a; margin-top:5px;}
  .field .err{font-size:12px; color:var(--red); margin-top:5px; font-weight:500;}
  .scan-input{
    width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid var(--line);
    font-family:'IBM Plex Mono',monospace; font-size:16px; background:#fbfaf6; color:var(--ink);
    letter-spacing:.02em;
  }
  .scan-input:focus{outline:none; border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px rgba(var(--accent-rgb),.15);}
  .scan-input.bad{border-color:var(--red); background:var(--red-soft);}
  .scan-input.locked{background:#ece9de; color:#8a8471; border-color:var(--line);}
  .text-input{
    width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid var(--line);
    font-size:15px; background:#fbfaf6; color:var(--ink); font-family:inherit;
  }
  .text-input:focus{outline:none; border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px rgba(var(--accent-rgb),.15);}

  .field-with-scan{display:flex; gap:8px; align-items:stretch;}
  .field-with-scan .scan-input{flex:1;}
  .scan-btn{
    width:48px; flex-shrink:0; border:none; border-radius:10px; background:var(--ink); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:19px;
  }
  .scan-btn:active{background:#0f151d;}
  .scan-region{width:100%; min-height:230px; border-radius:12px; overflow:hidden; background:#000;}
  .scan-region video{width:100%; display:block;}

  .seg{display:flex; gap:8px; flex-wrap:wrap;}
  .seg button{
    flex:1; min-width:80px; padding:12px 10px; border-radius:10px; border:1.5px solid var(--line);
    background:#fbfaf6; font-size:13.5px; font-weight:600; color:var(--ink-soft);
  }
  .seg button.active{background:var(--ink); border-color:var(--ink); color:#fff;}

  .dt-row{display:flex; gap:8px; align-items:center;}
  .dt-row .text-input{flex:1;}
  .dt-toggle{
    padding:12px 12px; border-radius:10px; border:1.5px solid var(--line); background:#fbfaf6;
    font-size:12px; font-weight:600; color:var(--ink-soft); white-space:nowrap;
  }
  .dt-toggle.active{background:var(--teal-soft); border-color:var(--teal); color:var(--teal);}

  .btn{
    width:100%; padding:14px; border-radius:12px; border:none; font-weight:600; font-size:15px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:active{background:#0f151d;}
  .btn-gold{background:var(--gold); color:#fff;}
  .btn-outline{background:#fff; color:var(--ink); border:1.5px solid var(--line);}
  .btn-teal{background:var(--teal); color:#fff;}
  .btn-sm{width:auto; padding:8px 14px; font-size:12.5px; border-radius:8px;}
  .btn-row{display:flex; gap:10px; margin-top:4px;}
  .btn-row .btn{flex:1;}

  .beam-banner{
    background:var(--ink); color:#fff; border-radius:14px; padding:16px 18px; margin-bottom:16px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .beam-banner .lbl{font-size:11px; letter-spacing:.1em; color:#b9c2cd; text-transform:uppercase; font-weight:600;}
  .beam-banner .id{font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; color:var(--accent); margin-top:2px;}
  .beam-banner .seqchip{background:rgba(255,255,255,.12); padding:6px 12px; border-radius:999px; font-family:'IBM Plex Mono',monospace; font-size:13px;}

  .entry-row{
    display:flex; justify-content:space-between; align-items:center; padding:10px 0;
    border-bottom:1px solid var(--line-soft); font-size:13.5px;
  }
  .entry-row:last-child{border-bottom:none;}
  .entry-row .l{color:var(--ink-soft);}
  .entry-row .r{font-family:'IBM Plex Mono',monospace; font-weight:600;}

  /* Status pill */
  .pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:999px;}
  .pill-run{background:var(--teal-soft); color:var(--teal);}
  .pill-run::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--teal);}
  .pill-done{background:#eee; color:#7a7a7a;}
  .pill-done::before{content:''; width:6px; height:6px; border-radius:50%; background:#aaa;}
  .pill-open{background:var(--accent-soft); color:var(--accent-deep);}
  .pill-open::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--accent);}

  /* Data table — professional data-grid treatment, not a spreadsheet dump */
  .report-card{background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:var(--shadow);}
  .report-toolbar{display:flex; gap:8px; padding:12px; border-bottom:1px solid var(--line-soft); background:#fbfaf6;}
  .report-search{flex:1; width:auto; padding:10px 13px; border-radius:9px; border:1.5px solid var(--line); background:#fff; font-size:13.5px; font-family:inherit;}
  .report-search:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(var(--accent-rgb),.15);}
  .report-toolbar .icobtn{
    flex-shrink:0; width:42px; border:1.5px solid var(--line); border-radius:9px; background:#fff; color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
  }
  .report-toolbar .icobtn:hover{border-color:var(--accent); color:var(--accent-deep);}
  .report-toolbar .icobtn.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-deep);}
  .date-filter-chip{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 14px; background:var(--accent-soft); color:var(--accent-deep); font-size:12.5px; font-weight:600;
    border-bottom:1px solid var(--line-soft);
  }
  .date-filter-chip svg{vertical-align:-3px; margin-right:2px;}
  .date-filter-chip button{background:none; border:none; color:var(--accent-deep); font-size:14px; cursor:pointer; padding:2px 4px;}
  .report-toolbar .icobtn:active{background:var(--line-soft);}
  .report-count{font-size:11.5px; color:var(--ink-soft); padding:8px 14px; border-top:1px solid var(--line-soft); background:#fbfaf6;}
  .colcheck-list{display:flex; flex-direction:column; gap:0; max-height:48vh; overflow-y:auto; margin:6px 0; border:1px solid var(--line-soft); border-radius:10px;}
  .colcheck-row{display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--line-soft); font-size:14px;}
  .colcheck-row:last-child{border-bottom:none;}
  .colcheck-row input{width:18px; height:18px; accent-color:var(--accent); flex-shrink:0;}
  .colmove{
    width:26px; height:26px; flex-shrink:0; border:1px solid var(--line); border-radius:6px; background:#fff;
    color:var(--ink-soft); font-size:10px; display:flex; align-items:center; justify-content:center;
  }
  .colmove:disabled{opacity:.3;}
  .colmove:not(:disabled):hover{border-color:var(--accent); color:var(--accent-deep);}
  th input[type="checkbox"], td input.rowselect{width:16px; height:16px; accent-color:var(--accent);}

  .table-wrap{overflow:auto; max-height:min(calc(100vh - 240px), 900px);}
  table{border-collapse:separate; border-spacing:0; width:100%; font-size:13px;}
  th{
    position:sticky; top:0; z-index:2;
    text-align:left; padding:9px 14px; background:#fbfaf6; color:var(--ink-soft);
    font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; font-weight:700; white-space:nowrap;
    border-bottom:1.5px solid var(--line);
  }
  th:first-child{left:0; z-index:3;}
  td:first-child{position:sticky; left:0; z-index:1; background:#fff; box-shadow:1px 0 0 var(--line-soft);}
  th.sortable{cursor:pointer; user-select:none;}
  th.sortable:hover{color:var(--ink); background:#f5f2e6;}
  th.sortable.active{color:var(--accent-deep);}
  th .sort-ic{margin-left:4px; opacity:.55; display:inline-flex; vertical-align:-2px;}
  th.sortable.active .sort-ic{opacity:1;}
  th.num{text-align:right;}
  td{padding:8px 14px; border-bottom:1px solid var(--line-soft); white-space:nowrap; font-size:13px; color:var(--ink); font-family:'Inter',system-ui,sans-serif;}
  td.mono{font-family:'IBM Plex Mono',monospace; font-size:12.5px;}
  td.num{text-align:right; font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-variant-numeric:tabular-nums;}
  tbody tr:hover td{background:#fbfaf6;}
  tr:last-child td{border-bottom:none;}

  .empty{
    text-align:center; padding:50px 20px; color:var(--ink-soft);
  }
  .empty .ic{font-size:34px; margin-bottom:10px;}
  .empty .t{font-weight:600; color:var(--ink); font-size:15px; margin-bottom:5px;}
  .empty .s{font-size:13px; max-width:280px; margin:0 auto; line-height:1.5;}

  .stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px;}
  .stat{background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center;}
  .stat .n{font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600;}
  .stat .l{font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-top:2px;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:12px 20px; border-radius:999px; font-size:13.5px;
    box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:100; opacity:0; transition:opacity .2s, transform .2s;
    display:flex; align-items:center; gap:8px; max-width:90%;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
  .toast.err{background:var(--red);}
  .toast .dot{width:7px; height:7px; border-radius:50%; background:var(--gold); flex-shrink:0;}
  .toast.err .dot{background:#fff;}

  .modal-bg{
    position:fixed; inset:0; background:rgba(27,36,48,.55); z-index:200;
    display:flex; align-items:flex-end; justify-content:center;
  }
  @media(min-width:520px){.modal-bg{align-items:center;}}
  .modal{
    background:#fff; border-radius:20px 20px 0 0; padding:22px; width:100%; max-width:480px;
  }
  @media(min-width:520px){.modal{border-radius:18px;}}
  .modal h3{font-size:17px; margin-bottom:6px;}
  .modal p{font-size:13.5px; color:var(--ink-soft); margin-bottom:16px; line-height:1.5;}

  .note{
    background:var(--teal-soft); border:1px solid #cfe4de; color:#20524a; font-size:12.5px;
    padding:10px 12px; border-radius:10px; margin-bottom:14px; line-height:1.5;
  }

  .ms-advanced{display:none; margin-top:14px; padding-top:14px; border-top:1px solid var(--line-soft);}
  .ms-advanced.open{display:block;}

  .gantt-legend{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:14px; font-size:12.5px; color:var(--ink-soft);}
  .gantt-legend span{display:inline-flex; align-items:center; gap:6px;}
  .gantt-legend i{width:12px; height:12px; border-radius:3px; display:inline-block;}
  .gantt-scroll{overflow:auto; border:1px solid var(--line); border-radius:14px; background:#fff; max-height:min(70vh,720px);}
  .gantt-header-row{display:flex; position:sticky; top:0; z-index:3; background:#fbfaf6;}
  .gantt-corner{position:sticky; left:0; z-index:4; background:#fbfaf6; border-bottom:1.5px solid var(--line); border-right:1px solid var(--line-soft); flex-shrink:0;}
  .gantt-days{display:flex; border-bottom:1.5px solid var(--line);}
  .gantt-daycell{flex-shrink:0; border-right:1px solid var(--line-soft); font-size:10.5px; color:var(--ink-soft); text-align:center; padding:8px 2px; text-transform:uppercase; letter-spacing:.04em; font-weight:700;}
  .gantt-row{display:flex; border-bottom:1px solid var(--line-soft);}
  .gantt-row:last-child{border-bottom:none;}
  .gantt-loom-label{position:sticky; left:0; z-index:2; background:#fff; border-right:1px solid var(--line-soft); flex-shrink:0; display:flex; align-items:center; padding:0 14px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600;}
  .gantt-track{position:relative; flex-shrink:0; height:38px;}
  .gantt-bar{
    position:absolute; top:6px; height:26px; border-radius:6px; overflow:hidden;

<script>
/* =========================================================
   SSML WEAVING — multi-plant weaving & warping follow-up
   Single-file app. Data persists in the browser (per device),
   scoped separately per production plant.
   ========================================================= */
const APP_VERSION = 'v3.10.0';

/* ---------- plant configuration ---------- */
const PLANTS = {
  SAILY: {
    label: 'Saily',
    warpRange: [95000001, 95999999],
    loomRanges: [[201,248],[301,364]],
    greyRange: [55000001, 55999999]
  },
  J177: {
    label: 'J-177',
    warpRange: [30000001, 30999999],
    loomRanges: [[101,126],[201,224],[301,326],[401,426],[501,526],[601,626],[701,726]],
    greyRange: [35000001, 35999999]
  },
  E125: {
    label: 'E-125',
    warpRange: [40000001, 40999999],
    loomRanges: [[701,772],[901,978]],
    greyRange: [45000001, 45999999]
  }
};
let currentPlant = null;

/* ---------- loom type (make) by loom number range ---------- */
const LOOM_TYPE_RANGES = {
  SAILY: [ {min:201, max:248, type:'AIRJET'}, {min:301, max:364, type:'PICANOL'} ],
  J177:  [ {min:101, max:726, type:'PICANOL'} ], // every J-177 loom range falls within this span
  E125:  [ {min:701, max:772, type:'SOMET'}, {min:901, max:978, type:'AIRJET'} ],
};
function getLoomType(plant, loomNo){
  const n = parseFloat(loomNo);
  if(isNaN(n)) return '—';
  const ranges = LOOM_TYPE_RANGES[plant] || [];
  const found = ranges.find(r => n>=r.min && n<=r.max);
  return found ? found.type : '—';
}

/* ---------- per-plant visual theme ----------
   Gives each plant its own accent color so operators get an instant
   glance-cue for which plant they're working in. Weaving screens use
   the plant accent; Warping keeps its fixed teal regardless of plant,
   so the two workflow types stay visually distinct within any plant. */
const THEMES = {
  SAILY: { accent:'#c68a2e', accentDeep:'#a06f1f', accentSoft:'#fbf3e4', accentRgb:'198,138,46' }, // gold
  J177:  { accent:'#3b5bab', accentDeep:'#2c4483', accentSoft:'#e7ecf7', accentRgb:'59,91,171'   }, // indigo
  E125:  { accent:'#b5652f', accentDeep:'#8f4d22', accentSoft:'#f7ece1', accentRgb:'181,101,47'  }  // rust
};
function applyTheme(plant){
  const t = (plant && THEMES[plant]) ? THEMES[plant] : THEMES.SAILY;
  const app = document.getElementById('app');
  app.style.setProperty('--accent', t.accent);
  app.style.setProperty('--accent-deep', t.accentDeep);
  app.style.setProperty('--accent-soft', t.accentSoft);
  app.style.setProperty('--accent-rgb', t.accentRgb);
}

/* ---------- Firestore (shared, multi-device/multi-user) backend ----------
   Everything flagged shared:true (scans, counters, SAP settings) needs to
   be visible to every phone/desktop in the plant at once — not just the
   device that wrote it. When a Firebase project ID is configured (Settings
   ⚙), shared reads/writes go to Google Cloud Firestore over its plain REST
   API (no SDK, no build step — just fetch()), so this stays a single
   static HTML file. With no project ID configured, shared storage quietly
   falls back to window.storage (Claude artifact preview) or this browser's
   own localStorage, exactly as before this feature existed — single-device
   mode keeps working with zero setup.

   Why Firestore and not another "shared backend": a Google Sheet was
   considered and explicitly ruled out (sheet writes aren't atomic without
   an external lock service, and a live sheet under constant small writes
   from several phones is slow and gets fragile fast). Firestore gives a
   genuinely atomic server-side counter (see fsNextId below) and typical
   write latency in the ~100-300ms range, which is what "two operators tap
   Scan at the same instant" actually needs. */
function getFirebaseProjectId(){
  try { return localStorage.getItem('ssml_firebase_pid') || ''; } catch(e){ return ''; }
}
function setFirebaseProjectIdSync(v){
  try {
    if (v) localStorage.setItem('ssml_firebase_pid', v);
    else localStorage.removeItem('ssml_firebase_pid');
  } catch(e){}
}
function fsBase(pid){
  return `https://firestore.googleapis.com/v1/projects/${pid}/databases/(default)/documents`;
}
// Firestore documents are field/value maps; this app only ever stores one
// plain string per key (same shape localStorage already used), so every
// document is just { fields: { v: { stringValue: "..." } } }.
function fsEncode(value){ return { fields: { v: { stringValue: String(value) } } }; }
function fsDecode(doc){ try { return doc.fields.v.stringValue; } catch(e){ return null; } }
// Firestore document IDs can't contain '/', and our keys look like
// "SAILY:counter:beam" or "SAILY:beamentry:...", so each key is
// URL-encoded into a single path segment.
function fsDocId(key){ return encodeURIComponent(key); }
async function fsGet(pid, key){
  try {
    const res = await fetch(`${fsBase(pid)}/kv/${fsDocId(key)}`);
    if (res.status === 404) return null;
    if (!res.ok) return null;
    const doc = await res.json();
    const value = fsDecode(doc);
    return value !== null ? {key, value, shared:true} : null;
  } catch(e){ return null; }
}
async function fsSet(pid, key, value){
  try {
    const res = await fetch(`${fsBase(pid)}/kv/${fsDocId(key)}?updateMask.fieldPaths=v`, {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(fsEncode(value))
    });
    if (!res.ok) return null;
    return {key, value, shared:true};
  } catch(e){ return null; }
}
async function fsDelete(pid, key){
  try {
    const res = await fetch(`${fsBase(pid)}/kv/${fsDocId(key)}`, { method:'DELETE' });
    if (!res.ok && res.status !== 404) return null;
    return {key, deleted:true, shared:true};
  } catch(e){ return null; }
}
async function fsList(pid, prefix){
  // "Starts with" range query bounded by the prefix and the 
  // high-Unicode sentinel — the standard Firestore trick for a prefix
  // scan — run against the document's own name (__name__) so it works
  // no matter what fields a document holds.
  try {
    const docRoot = `projects/${pid}/databases/(default)/documents/kv`;
    const body = {
      structuredQuery: {
        from: [{ collectionId: 'kv' }],
        where: { compositeFilter: { op:'AND', filters: [
          { fieldFilter: { field:{fieldPath:'__name__'}, op:'GREATER_THAN_OR_EQUAL', value:{referenceValue:`${docRoot}/${fsDocId(prefix)}`} } },
          { fieldFilter: { field:{fieldPath:'__name__'}, op:'LESS_THAN', value:{referenceValue:`${docRoot}/${fsDocId(prefix)}`} } }
        ]}},
        limit: 2000
      }
    };
    const res = await fetch(`${fsBase(pid)}:runQuery`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    if (!res.ok) return {keys:[]};
    const rows = await res.json();
    const keys = (Array.isArray(rows) ? rows : []).filter(r=>r.document).map(r => decodeURIComponent(r.document.name.split('/').pop()));
    return {keys};
  } catch(e){ return {keys:[]}; }
}
/* Atomic ID counter via Firestore's native "increment" field transform,
   sent through :commit. This is a true server-side atomic add — Firestore
   itself serializes two simultaneous increments on the same counter
   document, so two phones tapping "Scan new beam" in the same plant at
   the exact same millisecond are still guaranteed two different numbers
   back; there is no read-then-write race window on the client at all
   (unlike the old "read count, write count+1" local counter, which is
   exactly what could collide between two devices). The transform also
   creates the counter document (starting from 0) the first time it's used
   — no separate "initialize the counter" step needed. */
async function fsNextId(pid, key){
  try {
    const path = `projects/${pid}/databases/(default)/documents/counters/${fsDocId(key)}`;
    const body = { writes: [{ transform: { document: path, fieldTransforms: [{ fieldPath:'n', increment:{ integerValue:'1' } }] } }] };
    const res = await fetch(`${fsBase(pid)}:commit`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    if (!res.ok) return null;
    const out = await res.json();
    const n = out?.writeResults?.[0]?.transformResults?.[0]?.integerValue;
    return n !== undefined ? parseInt(n,10) : null;
  } catch(e){ return null; }
}

/* ---------- storage abstraction ----------
   shared:true  -> Firestore when a project ID is configured (multi-device,
                   multi-user — scans, counters, SAP settings), else
                   window.storage/localStorage as a single-device fallback.
   shared:false -> always this device's own window.storage/localStorage.
                   Used for per-operator state (current user, in-progress
                   scan session) that should NOT sync across devices —
                   each phone belongs to one operator at a time, so this
                   is what already keeps one operator's in-progress
                   sequence numbering (1,2,3…) from ever being visible to,
                   let alone colliding with, another operator's. */
const Storage = {
  async get(key, shared=true){
    const pid = shared ? getFirebaseProjectId() : '';
    if (pid) { const r = await fsGet(pid, key); if (r !== null) return r; }
    if (window.storage) { try { return await window.storage.get(key, shared); } catch(e){ return null; } }
    try { const v = localStorage.getItem(key); return v!==null ? {key,value:v,shared} : null; } catch(e){ return null; }
  },
  async set(key, value, shared=true){
    const pid = shared ? getFirebaseProjectId() : '';
    if (pid) { const r = await fsSet(pid, key, value); if (r !== null) return r; }
    if (window.storage) { try { return await window.storage.set(key, value, shared); } catch(e){ return null; } }
    try { localStorage.setItem(key, value); return {key,value,shared}; } catch(e){ return null; }
  },
  async delete(key, shared=true){
    const pid = shared ? getFirebaseProjectId() : '';
    if (pid) { const r = await fsDelete(pid, key); if (r !== null) return r; }
    if (window.storage) { try { return await window.storage.delete(key, shared); } catch(e){ return null; } }
    try { localStorage.removeItem(key); return {key,deleted:true,shared}; } catch(e){ return null; }
  },
  async list(prefix='', shared=true){
    const pid = shared ? getFirebaseProjectId() : '';
    if (pid) { return await fsList(pid, prefix); }
    if (window.storage) { try { return await window.storage.list(prefix, shared); } catch(e){ return {keys:[]}; } }
    try { const keys = Object.keys(localStorage).filter(k=>k.startsWith(prefix)); return {keys}; } catch(e){ return {keys:[]}; }
  }
};

function pad5(n){ return String(n).padStart(5,'0'); }
const SCAN_ICON = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V6a2 2 0 0 1 2-2h2"/><path d="M17 4h2a2 2 0 0 1 2 2v2"/><path d="M21 16v2a2 2 0 0 1-2 2h-2"/><path d="M7 20H5a2 2 0 0 1-2-2v-2"/><line x1="4" y1="12" x2="20" y2="12"/></svg>`;
const GEAR_ICON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`;
const HOME_ICON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>`;
const NAV_ICON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>`;
const TRASH_ICON = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`;
function nowStamp(){
  const d = new Date();
  const p = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtDT(v){
  if(!v) return '—';
  const [datePart, timePart] = v.split('T');
  if(!datePart) return v;
  const [y,m,d] = datePart.split('-');
  if(!y || !m || !d) return v;
  const dmy = `${d}-${m}-${y.slice(-2)}`;
  return timePart ? `${dmy} ${timePart}` : dmy;
}

/* ---------- date math (local, no-seconds "datetime-local" strings) ---------- */
function parseLocalDT(s){
  if(!s) return null;
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}
function formatLocalDT(d){
  const p = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function addMinutesToDT(s, minutes){
  const d = parseLocalDT(s);
  if(!d || !isFinite(minutes)) return null;
  d.setMinutes(d.getMinutes() + Math.round(minutes));
  return formatLocalDT(d);
}
function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function endOfDay(d){ const x=new Date(d); x.setHours(23,59,59,999); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function toDateInputValue(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function datePreset(name){
  const now = new Date();
  if(name==='today') return {from:startOfDay(now), to:endOfDay(now)};
  if(name==='tomorrow'){ const t=addDays(now,1); return {from:startOfDay(t), to:endOfDay(t)}; }
  if(name==='next7') return {from:startOfDay(now), to:endOfDay(addDays(now,6))};
  if(name==='thisweek'){
    const day = now.getDay();
    const monday = addDays(now, day===0?-6:1-day);
    return {from:startOfDay(monday), to:endOfDay(addDays(monday,6))};
  }
  if(name==='thismonth'){
    const first = new Date(now.getFullYear(), now.getMonth(), 1);
    const last = new Date(now.getFullYear(), now.getMonth()+1, 0);
    return {from:startOfDay(first), to:endOfDay(last)};
  }
  return null;
}
function toNum(v){
  if(v===null||v===undefined) return null;
  const n = parseFloat(String(v).replace(/[^0-9.\-]/g,''));
  return isNaN(n) ? null : n;
}

/* ---------- master search (SAP-style multi-value / range matching) ----------
   Each field accepts a comma-separated mix of exact/substring values and
   numeric ranges ("55000001-55000050"), matched with OR logic within a
   field and AND logic across fields — same pattern as SAP's multiple
   selection. */
function parseSearchTokens(input){
  if(!input || !input.trim()) return [];
  return input.split(/[,;\n\t\r]+/).map(s=>s.trim()).filter(Boolean).map(tok=>{
    const rangeMatch = tok.match(/^(\d+)\s*-\s*(\d+)$/);
    if(rangeMatch) return { type:'range', min:parseInt(rangeMatch[1],10), max:parseInt(rangeMatch[2],10) };
    return { type:'value', value:tok };
  });
}
function tokensMatch(tokens, rawValue){
  if(!tokens.length) return true;
  const val = String(rawValue ?? '').trim();
  if(!val) return false;
  const numVal = toNum(val);
  return tokens.some(t => t.type==='range' ? (numVal!=null && numVal>=t.min && numVal<=t.max) : val.toLowerCase().includes(t.value.toLowerCase()));
}

async function runMasterSearch(criteria){
  const results = [];
  for(const plant of ['SAILY','J177','E125']){
    for(const dept of ['grey','beam']){
      const sapInfo = await fetchSapSheet(plant, dept);
      if(!sapInfo.linked || !sapInfo.rows.length) continue;
      const headerMap = buildHeaderMap(sapInfo.headers, dept);
      const joinCol = headerMap[SAP_JOIN_BY_DEPT[dept]];
      const soCol = headerMap['SO'];
      const qicCol = headerMap['QIC'];
      const finalQicCol = headerMap['FINAL QIC'];
      const chartCol = headerMap['CHART-DESIGN'];
      const contractCol = headerMap['contract'];
      for(const row of sapInfo.rows){
        if(criteria.so.length && !tokensMatch(criteria.so, soCol && row[soCol])) continue;
        if(criteria.qic.length){
          const hit = tokensMatch(criteria.qic, qicCol && row[qicCol]) || tokensMatch(criteria.qic, finalQicCol && row[finalQicCol]);
          if(!hit) continue;
        }
        if(criteria.contract.length && !tokensMatch(criteria.contract, contractCol && row[contractCol])) continue;
        results.push({ plant, dept, orderNo: joinCol ? row[joinCol] : null, row, headerMap, soCol, qicCol, finalQicCol, chartCol, contractCol });
        if(results.length >= 60) return results; // keep results reviewable
      }
    }
  }
  return results;
}

async function enrichSearchResult(r){
  const plant = r.plant, orderNo = String(r.orderNo ?? '').trim();
  const out = { ...r, weaving:null, warping:null };
  if(r.dept==='grey'){
    const beamEntries = await loadAll(`${plant}:beamentry:`, false);
    const match = beamEntries.find(e=>e.greyOrder===orderNo);
    if(match){
      const loRec = await Storage.get(`${plant}:looporder:${match.greyOrder}`, false);
      let lo=null; try{ lo = loRec ? JSON.parse(loRec.value) : null; }catch(e){}
      out.weaving = { beamId:match.beamId, seq:match.seq, loomNo:match.loomNo, mountDT:match.mountDT, status: lo?lo.status:'not started', rpm: lo?.loomRpm, efficiency: lo?.efficiency };
    }
    const batchCol = r.headerMap['BeamBatch'];
    const beamBatch = batchCol ? r.row[batchCol] : null;
    if(beamBatch){
      const warpBeams = await loadAll(`${plant}:warpbeam:`, false);
      const wmatch = warpBeams.find(b=>normOrderKey(b.warpOrder)===normOrderKey(beamBatch));
      if(wmatch) out.warping = { beamId:wmatch.beamId, warpOrder:wmatch.warpOrder, machineNo:wmatch.machineNo, status:wmatch.status, warpDT:wmatch.warpDT };
    }
  } else {
    const warpBeams = await loadAll(`${plant}:warpbeam:`, false);
    const match = warpBeams.find(b=>b.warpOrder===orderNo);
    if(match) out.warping = { beamId:match.beamId, warpOrder:match.warpOrder, machineNo:match.machineNo, status:match.status, warpDT:match.warpDT };
  }
  return out;
}

/* ---------- per-sequence custom RPM/efficiency override ----------
   Overrides are per SEQUENCE, not per beam: RPM/Efficiency carry forward
   from whichever sequence last set them (an actual Start Loom Order Scan,
   or a manual override), until a later sequence changes them again. */
async function getSeqOverride(plant, beamId, seq){
  const rec = await Storage.get(`${plant}:seqoverride:${beamId}:${seq}`, false);
  if(!rec || !rec.value) return null;
  try{ return JSON.parse(rec.value); }catch(e){ return null; }
}
async function setSeqOverride(plant, beamId, seq, override){
  await Storage.set(`${plant}:seqoverride:${beamId}:${seq}`, JSON.stringify(override), false);
}

/* ---------- production / projection engine ----------
   Production (m/hr) = (RPM x 60 x Efficiency) / (39.37 x PPI x 100)
   Production per day = Production per hour x 24
   Total run hours     = Order Qty / Production per hour

   Sequence 1's actual/projected start comes from its own Start Loom Order
   Scan. Each later sequence's projected start is the previous sequence's
   actual (if Finish order scanned) or projected beam-fall time, +30 min.

   RPM/Efficiency are considered order-wise: a sequence uses (in priority
   order) its own custom override, else its own actual Start Loom Order
   Scan values, else whatever carried forward from the previous sequence.
   Changing sequence 2's RPM/Eff therefore affects 2, 3, 4... onward,
   until a later sequence sets its own.

   Quality status: exactly one sequence is "ON LOOM" (the first
   not-yet-finished one); everything after it is "U/Ktg"; anything
   finished (via Finish order scan, or auto-finished once Delivered Qty
   reaches 90% of Order Qty) shows "FINISH".

   Final beam runout date/time is one shared value for the whole beam:
   the LAST sequence's PROJECTED beam-fall time. */
function computeProductionPerHour(rpm, eff, ppi){
  rpm = toNum(rpm); eff = toNum(eff); ppi = toNum(ppi);
  if(!rpm || !eff || !ppi) return null;
  return (rpm * 60 * eff) / (39.37 * ppi * 100);
}

/* A loom can only run one beam at a time. Before a brand-new "Scan new
   beam" is allowed on a loom, check whether any beam already mounted on
   that loom is still Running (not every sequence finished — neither via
   Finish order scan nor auto-finished by Delivered Qty). */
async function findBusyBeamOnLoom(plant, loomNo){
  const beamEntries = await loadAll(`${plant}:beamentry:`, false);
  const candidateBeamIds = new Set(beamEntries.filter(e=>String(e.loomNo)===String(loomNo)).map(e=>e.beamId));
  if(!candidateBeamIds.size) return null;

  const loomOrders = await loadAll(`${plant}:looporder:`, false);
  const looporderByGrey = {}; loomOrders.forEach(o=>looporderByGrey[o.greyOrder]=o);
  const sapInfo = await fetchSapSheet(plant, 'grey');
  const headerMap = buildHeaderMap(sapInfo.headers, 'grey');
  const sapMap = sapMapByOrder(sapInfo.rows, headerMap, 'grey');

  for(const beamId of candidateBeamIds){
    const entries = beamEntries.filter(e=>e.beamId===beamId).sort((a,b)=>a.seq-b.seq);
    const { beamStatus } = await computeBeamSequences(plant, beamId, entries, looporderByGrey, sapMap, headerMap);
    if(beamStatus === 'Running') return beamId;
  }
  return null;
}

async function computeBeamSequences(plant, beamId, entries, looporderByGrey, sapMapGrey, headerMapGrey){
  const results = [];
  let cursorStart = null;
  let carryRpm = null, carryEff = null;

  for(let i=0;i<entries.length;i++){
    const e = entries[i];
    const lo = looporderByGrey[e.greyOrder] || null;
    const override = await getSeqOverride(plant, beamId, e.seq);
    const sapRow = sapMapGrey[normOrderKey(e.greyOrder)] || null;
    const orderQty = sapRow && headerMapGrey['ORDER QTY'] ? toNum(sapRow[headerMapGrey['ORDER QTY']]) : null;
    const deliveredQty = sapRow && headerMapGrey['DELIVERED QTY'] ? toNum(sapRow[headerMapGrey['DELIVERED QTY']]) : null;
    const ppi = sapRow && headerMapGrey['PPI'] ? toNum(sapRow[headerMapGrey['PPI']]) : null;

    // order-wise RPM/Efficiency: override > this sequence's own actual scan > carried forward
    const effRpm = (override && override.loomRpm) || (lo && lo.loomRpm) || carryRpm || null;
    const effEff = (override && override.efficiency) || (lo && lo.efficiency) || carryEff || null;
    carryRpm = effRpm; carryEff = effEff;

    let actualStart = null, projectedStart = null;
    if(i===0){
      if(lo && lo.startDT){ actualStart = lo.startDT; projectedStart = lo.startDT; }
    } else {
      projectedStart = cursorStart;
      if(lo && lo.startDT) actualStart = lo.startDT;
    }

    const startBasis = actualStart || projectedStart;
    const prodPerHour = computeProductionPerHour(effRpm, effEff, ppi);
    const prodPerDay = prodPerHour!=null ? prodPerHour*24 : null;
    let projectedFall = null;
    let isTentative = false;
    if(startBasis && prodPerHour && orderQty){
      projectedFall = addMinutesToDT(startBasis, (orderQty / prodPerHour) * 60);
    } else if(!startBasis && prodPerDay && orderQty!=null && deliveredQty!=null){
      // No actual loom start recorded, but SAP already shows delivered progress —
      // estimate the remaining run from today based on balance to deliver.
      const balance = orderQty - deliveredQty;
      if(prodPerDay > 0){
        const daysRemaining = Math.max(balance, 0) / prodPerDay;
        projectedFall = addMinutesToDT(nowStamp(), daysRemaining * 24 * 60);
        isTentative = true;
      }
    }

    let actualFall = null;
    if(lo && lo.status==='finished' && lo.finishDT) actualFall = lo.finishDT;

    const autoFinished = (orderQty!=null && deliveredQty!=null && orderQty>0) ? (deliveredQty >= 0.9*orderQty) : false;
    const isFinished = !!actualFall || autoFinished;

    results.push({
      seq:e.seq, greyOrder:e.greyOrder, loomNo:e.loomNo,
      actualStart, projectedStart, actualFall, projectedFall, isFinished, isTentative,
      effRpm, effEff, prodPerHour, prodPerDay,
      shift: lo?.shift || null, changeoverType: lo?.changeoverType || null,
      hasOverride: !!override,
    });

    const basisForNext = actualFall || projectedFall;
    cursorStart = basisForNext ? addMinutesToDT(basisForNext, 30) : null;
  }

  let activeAssigned = false;
  results.forEach(r=>{
    if(r.isFinished){ r.qualityStatus = 'FINISH'; return; }
    if(!activeAssigned){ r.qualityStatus = 'ON LOOM'; activeAssigned = true; }
    else { r.qualityStatus = 'U/Ktg'; }
  });

  const anyActive = results.some(r=>r.qualityStatus==='ON LOOM' || r.qualityStatus==='U/Ktg');
  const beamStatus = results.length ? (anyActive ? 'Running' : 'Finish') : '—';
  // shared across the whole beam: last sequence's PROJECTED beam-fall time
  const beamFinalRunout = results.length ? results[results.length-1].projectedFall : null;
  const beamFinalRunoutIsTentative = results.length ? results[results.length-1].isTentative : false;
  results.forEach(r=>{ r.finalRunout = beamFinalRunout; r.finalRunoutIsTentative = beamFinalRunoutIsTentative; });

  return { results, beamStatus, beamFinalRunout };
}

/* Scan-first entry point: scan a grey order, resolve which beam+sequence
   it belongs to, then open the same revise-RPM/efficiency modal. */
function openReviseRpmEffByScan(plant, onSaved){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3>Revise RPM / efficiency</h3>
      <p>Scan the grey order whose loom RPM or efficiency you want to change.</p>
      <div class="field">
        <label>Grey order</label>
        <div class="field-with-scan">
          <input id="revGreyOrder" class="scan-input" inputmode="numeric" autofocus
            onkeydown="if(event.key==='Enter'){event.preventDefault(); lookupRpmEffByGrey('${plant}');}">
          <button type="button" class="scan-btn" onclick="openBarcodeScanner('revGreyOrder', {onScanned:'lookupRpmEffByGrey_${plant}'})" aria-label="Scan grey order">${SCAN_ICON}</button>
        </div>
        <div id="revGreyOrderErr"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="this.closest('.modal-bg').remove()">Cancel</button>
        <button class="btn btn-primary" onclick="lookupRpmEffByGrey('${plant}')">Continue</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  window[`lookupRpmEffByGrey_${plant}`] = () => lookupRpmEffByGrey(plant);
  window.__reviseOnSaved = onSaved;
}
async function lookupRpmEffByGrey(plant){
  const val = document.getElementById('revGreyOrder').value.trim();
  const errEl = document.getElementById('revGreyOrderErr');
  errEl.innerHTML = '';
  if(!validGreyOrder(plant, val)){
    errEl.innerHTML = `<div class="err">Grey order must be ${greyRangeHint(plant)}.</div>`; return;
  }
  const entries = await loadAll(`${plant}:beamentry:`, false);
  const match = entries.find(e=>e.greyOrder===val);
  if(!match){
    errEl.innerHTML = `<div class="err">This grey order hasn't been scanned in "Scan new beam" yet.</div>`; return;
  }
  const looporders = await loadAll(`${plant}:looporder:`, false);
  const looporderByGrey = {}; looporders.forEach(o=>looporderByGrey[o.greyOrder]=o);
  const beamEntries = entries.filter(e=>e.beamId===match.beamId).sort((a,b)=>a.seq-b.seq);
  const sapInfo = await fetchSapSheet(plant, 'grey');
  const headerMap = buildHeaderMap(sapInfo.headers, 'grey');
  const sapMap = sapMapByOrder(sapInfo.rows, headerMap, 'grey');
  const { results } = await computeBeamSequences(plant, match.beamId, beamEntries, looporderByGrey, sapMap, headerMap);
  const r = results.find(x=>x.greyOrder===val);
  document.querySelector('.modal-bg')?.remove();
  openSeqOverrideModal(plant, match.beamId, match.seq, r?.effRpm, r?.effEff, window.__reviseOnSaved || (()=>{}));
}

function toast(msg, isErr){
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ---------- validation (plant-aware) ---------- */
function validLoomNo(plant, v){
  const n = parseInt(v,10);
  if(isNaN(n)) return false;
  return PLANTS[plant].loomRanges.some(([a,b]) => n>=a && n<=b);
}
function validGreyOrder(plant, v){
  const n = parseInt(v,10);
  if(isNaN(n)) return false;
  const [a,b] = PLANTS[plant].greyRange;
  return n>=a && n<=b;
}
function validWarpOrder(plant, v){
  const n = parseInt(v,10);
  if(isNaN(n)) return false;
  const [a,b] = PLANTS[plant].warpRange;
  return n>=a && n<=b;
}
function loomRangeHint(plant){
  return PLANTS[plant].loomRanges.map(([a,b])=>`${a}–${b}`).join(', ');
}
function greyRangeHint(plant){ const [a,b]=PLANTS[plant].greyRange; return `${a}–${b}`; }
function warpRangeHint(plant){ const [a,b]=PLANTS[plant].warpRange; return `${a}–${b}`; }

/* ---------- counters (auto IDs, per plant) ----------
   Tries the atomic Firestore counter first (fsNextId — see above; this is
   what guarantees two operators scanning in the same plant at the same
   instant still get two different IDs). Falls back to the old local
   read-count/write-count+1 counter only when no Firebase project is
   configured, matching single-device mode exactly as before. */
async function nextBeamId(plant){
  const pid = getFirebaseProjectId();
  if (pid) { const n = await fsNextId(pid, `${plant}:counter:beam`); if (n !== null) return `${plant}-BEAM${pad5(n)}`; }
  const rec = await Storage.get(`${plant}:counter:beam`);
  const cur = rec ? parseInt(rec.value,10) : 0;
  const next = cur+1;
  await Storage.set(`${plant}:counter:beam`, String(next));
  return `${plant}-BEAM${pad5(next)}`;
}
async function nextWarpId(plant){
  const pid = getFirebaseProjectId();
  if (pid) { const n = await fsNextId(pid, `${plant}:counter:warp`); if (n !== null) return `${plant}-WARP${pad5(n)}`; }
  const rec = await Storage.get(`${plant}:counter:warp`);
  const cur = rec ? parseInt(rec.value,10) : 0;
  const next = cur+1;
  await Storage.set(`${plant}:counter:warp`, String(next));
  return `${plant}-WARP${pad5(next)}`;
}

/* ---------- current user + role (per device/operator) ----------
   The user ID itself is unchanged (a free-text ID stamped on every entry,
   stored locally per device — see the Storage doc comment above for why
   that's also what keeps simultaneous operators' in-progress sequence
   numbering from colliding). Role is new: a simple ROLE OF USERS list
   (Operator / Supervisor / Admin) stored alongside it, also per device,
   used to gate the SAP/Firestore Settings screen to Supervisor+Admin so
   ordinary operators scanning on the shop floor can't accidentally change
   sheet links or the shared-backend configuration. */
const USER_ROLES = ['Operator','Supervisor','Admin'];
async function getUser(){
  const rec = await Storage.get('currentUser', false);
  return rec ? rec.value : '';
}
async function setUser(v){
  await Storage.set('currentUser', v, false);
}
async function getUserRole(){
  const rec = await Storage.get('currentUserRole', false);
  return (rec && USER_ROLES.includes(rec.value)) ? rec.value : 'Operator';
}
async function setUserRole(v){
  await Storage.set('currentUserRole', USER_ROLES.includes(v) ? v : 'Operator', false);
}
async function isAdminUser(){
  const r = await getUserRole();
  return r === 'Supervisor' || r === 'Admin';
}
async function requireUser(){
  const u = await getUser();
  if(!u){
    toast('Set your user ID (top right) first', true);
    openUserModal();
    return null;
  }
  return u;
}
async function requireAdmin(){
  if (!(await isAdminUser())){
    toast('Settings are restricted to Supervisor/Admin users', true);
    return false;
  }
  return true;
}

/* =========================================================
/* =========================================================
   SAP DATA — linked Google Sheets via a Google Apps Script relay
   One sheet per plant per department: e.g. Saily's Warping reads
   "SAILY BEAM", Saily's Weaving reads "SAILY GREY". Headers are fixed
   (as given) and always join on ORDER NO.

   Uses the SAME published-CSV links you already have (File > Share >
   Publish to web > CSV) — no spreadsheet ID, no different link needed.
   A tiny Apps Script Web App (sap-proxy.gs) relays each link server-side,
   which sidesteps the browser CORS block Google's CSV endpoint hits when
   fetched directly. See CLAUDE.md for the full investigation.

   Config is shared (one setup covers everyone on the Claude preview);
   on a standalone deployment each browser needs its own one-time setup
   since there's no shared backend.
   ========================================================= */
const SAP_HEADERS_BY_DEPT = {
  beam: ['BEAM ORDER','WEAVING PLANT','SO','ITEM','PREFIX','QIC','suffix','FINAL QIC','CHART-DESIGN','MKT SHADE','REED','RS','PPI','contract','CHART NO','ORDER QTY','DELIVERED QTY'],
  grey: ['GREY ORDER','WEAVING PLANT','SO','ITEM','PREFIX','QIC','suffix','FINAL QIC','CHART-DESIGN','MKT SHADE','REED','RS','PPI','contract','CHART NO','ORDER QTY','DELIVERED QTY','BeamBatch'],
};
const SAP_JOIN_BY_DEPT = { beam:'BEAM ORDER', grey:'GREY ORDER' };
const SAP_SHEET_LABEL = { SAILY:{beam:'SAILY BEAM', grey:'SAILY GREY'}, J177:{beam:'J177 BEAM', grey:'J177 GREY'}, E125:{beam:'E125 BEAM', grey:'E125 GREY'} };

function parseCsv(text){
  const result = Papa.parse(text, { header:true, skipEmptyLines:true });
  const headers = (result.meta && result.meta.fields) ? result.meta.fields : [];
  return { headers, rows: result.data };
}

async function getSapSheets(){
  const rec = await Storage.get('sapsheets', true);
  if(!rec || !rec.value) return {};
  try{ return JSON.parse(rec.value); }catch(e){ return {}; }
}
async function setSapSheets(obj){
  await Storage.set('sapsheets', JSON.stringify(obj), true);
}

/* dept: 'beam' (Warping) or 'grey' (Weaving) */
/* Accepts either a normal Google Sheets link (docs.google.com/spreadsheets/
   d/ID/edit?gid=TAB) or a published-CSV link, and builds the right query
   for the Apps Script relay — the user doesn't need to know the difference. */
function buildSapRequestUrl(scriptUrl, sheetLink){
  const idMatch = sheetLink.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  const isPublishLink = /\/d\/e\//.test(sheetLink);
  if(idMatch && !isPublishLink){
    const id = idMatch[1];
    const gidMatch = sheetLink.match(/[?&#]gid=(\d+)/);
    const gid = gidMatch ? gidMatch[1] : '';
    return `${scriptUrl}?id=${encodeURIComponent(id)}${gid ? '&gid='+encodeURIComponent(gid) : ''}`;
  }
  return `${scriptUrl}?url=${encodeURIComponent(sheetLink)}`;
}

const __sapMemCache = {}; // "plant:dept" -> {data, timestamp} — short-lived, cleared by SAP settings save
const SAP_CACHE_TTL_MS = 90000; // 90s: fresh enough, but avoids refetching the whole sheet on every report navigation

async function fetchSapSheet(plant, dept){
  const memKey = `${plant}:${dept}`;
  const mem = __sapMemCache[memKey];
  if(mem && (Date.now() - mem.timestamp) < SAP_CACHE_TTL_MS) return mem.data;

  const sheets = await getSapSheets();
  const scriptUrl = sheets?.scriptUrl;
  const csvUrl = sheets?.[plant]?.[dept+'Url'];
  const cacheKey = `sapcache:${plant}:${dept}`;
  if(!scriptUrl || !csvUrl) return { rows:[], headers:[], fetchedAt:null, linked:false };
  try{
    const relayUrl = buildSapRequestUrl(scriptUrl, csvUrl);
    const res = await fetch(relayUrl, { cache:'no-store' });
    if(!res.ok) throw new Error('bad status');
    const text = await res.text();
    const { headers, rows } = parseCsv(text);
    const fetchedAt = nowStamp();
    await Storage.set(cacheKey, JSON.stringify({ rows, headers, fetchedAt }), false);
    const result = { rows, headers, fetchedAt, linked:true, fromCache:false };
    __sapMemCache[memKey] = { data: result, timestamp: Date.now() };
    return result;
  }catch(e){
    const cached = await Storage.get(cacheKey, false);
    if(cached && cached.value){
      try{ const d = JSON.parse(cached.value); return { rows:d.rows||[], headers:d.headers||[], fetchedAt:d.fetchedAt, linked:true, fromCache:true }; }catch(e2){}
    }
    return { rows:[], headers:[], fetchedAt:null, linked:true, fromCache:false, error:true };
  }
}

/* Header and value matching is deliberately forgiving: real-world sheets
   rarely match a spec character-for-character (extra spaces, different
   casing, number formatting with commas, etc). We match headers ignoring
   case/whitespace, and match order numbers by digits only. */
function normHeader(h){ return String(h||'').replace(/\s+/g,' ').trim().toUpperCase(); }
function normOrderKey(v){ return String(v??'').replace(/[^0-9]/g,''); }

function buildHeaderMap(actualHeaders, dept){
  const map = {};
  SAP_HEADERS_BY_DEPT[dept].forEach(h=>{
    const norm = normHeader(h);
    map[h] = actualHeaders.find(a => normHeader(a) === norm) || null;
  });
  return map;
}

function sapMapByOrder(rows, headerMap, dept){
  const joinKey = headerMap[SAP_JOIN_BY_DEPT[dept]];
  const map = {};
  if(!joinKey) return map;
  rows.forEach(r=>{ const k = normOrderKey(r[joinKey]); if(k) map[k]=r; });
  return map;
}

/* Column defs for a department's SAP fields — attach to a report's row set
   by setting row.__sapKey to that row's order number (grey order or beam
   order) before calling renderReport. */
function sapExtraColumns(sapMap, headerMap, dept){
  return SAP_HEADERS_BY_DEPT[dept].map(h => {
    const actualKey = headerMap[h];
    return {
      key: 'sap__'+h.replace(/[^a-zA-Z0-9]/g,'_'),
      label: h,
      get: r => { if(!actualKey) return ''; const s = sapMap[normOrderKey(r.__sapKey)]; return s ? (s[actualKey] ?? '') : ''; }
    };
  });
}

function sapSyncNote(info, sheetLabel, headerMap, dept){
  if(!info.linked) return `<div class="note">No sheet linked for "${sheetLabel}" yet — tap the \u2699 icon (top right) to set it up.</div>`;
  if(info.error) return `<div class="note" style="background:var(--red-soft); border-color:#e3c6c1; color:#7a2c23;">Couldn't reach "${sheetLabel}" and no cached copy is saved yet. Check the Apps Script URL and the CSV link in Settings.</div>`;
  const cacheNote = info.fromCache ? ` (cached copy from ${fmtDT(info.fetchedAt)} — couldn't reach it just now)` : ` synced just now (${fmtDT(info.fetchedAt)})`;
  const joinCol = SAP_JOIN_BY_DEPT[dept];
  if(headerMap && !headerMap[joinCol]){
    return `<div class="note" style="background:var(--red-soft); border-color:#e3c6c1; color:#7a2c23;">"${sheetLabel}"${cacheNote}, ${info.rows.length} rows — but no "${joinCol}" column was found. Sheet columns seen: ${info.headers.join(', ') || '(none)'}. Check the header spelling in row 1 of that sheet.</div>`;
  }
  const missing = headerMap ? SAP_HEADERS_BY_DEPT[dept].filter(h=>!headerMap[h]) : [];
  const missingNote = missing.length ? ` ${missing.length} column${missing.length===1?'':'s'} not found in the sheet (${missing.join(', ')}) — those will show blank.` : '';
  return `<div class="note">"${sheetLabel}"${cacheNote}, ${info.rows.length} rows.${missingNote}</div>`;
}

async function openSapSettings(){
  if (!(await requireAdmin())) return;
  const sheets = await getSapSheets();
  const urlField = (plant, dept) => {
    const label = SAP_SHEET_LABEL[plant][dept];
    const val = sheets?.[plant]?.[dept+'Url'] || '';
    return `
      <div class="field">
        <label>${PLANTS[plant].label} \u2014 ${dept==='beam'?'Warping':'Weaving'} sheet (${label})</label>
        <input id="sap_${plant}_${dept}" class="text-input" placeholder="Paste the sheet's normal URL or its published CSV link" value="${val}">
      </div>`;
  };
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal" style="max-height:88vh; overflow-y:auto;">
      <h3>SAP data \u2014 linked Google Sheets</h3>
      <p>Deploy <code>sap-proxy.gs</code> once as a Google Apps Script Web App (see CLAUDE.md) and paste its URL below. For each sheet, paste either its <b>normal address-bar link</b> (docs.google.com/spreadsheets/d/.../edit?gid=...) or a <b>published CSV link</b> if you already have one — either works, no need to publish anything new.</p>
      <div class="note" style="margin-bottom:14px;">
        Warping sheets join on <b>BEAM ORDER</b>: ${SAP_HEADERS_BY_DEPT.beam.join(', ')}<br>
        Weaving sheets join on <b>GREY ORDER</b>: ${SAP_HEADERS_BY_DEPT.grey.join(', ')}
      </div>

      <div class="field">
        <label>Apps Script Web App URL (one, shared by all 6 sheets)</label>
        <input id="sap_scripturl" class="text-input" placeholder="https://script.google.com/macros/s/XXXXX/exec" value="${sheets?.scriptUrl||''}">
      </div>

      <h3 style="margin:18px 0 8px;">Shared backend (multi-user scanning)</h3>
      <div class="note" style="margin-bottom:10px;">
        Leave this blank to keep using this device only (data stays in this browser). Fill it in once and every phone/desktop that signs into the same Firebase project shares live scan data, with no overlap or duplicate Beam/Warp/Cut IDs even if two people scan at the exact same moment. Setup (one-time, ~5 min): at <code>console.firebase.google.com</code> create a project → Build → Firestore Database → Create database → <b>Start in test mode</b> (or set the rules below) → Project settings (⚙, top left) → copy the <b>Project ID</b> (not the project name) → paste it below.
      </div>
      <div class="field">
        <label>Firebase Project ID</label>
        <input id="firebase_pid" class="text-input" placeholder="e.g. ssml-weaving-prod" value="${getFirebaseProjectId()}">
      </div>
      <div class="note" style="margin-bottom:14px;">
        Security, honestly: Firestore's "test mode" rules expire after 30 days; the rule below is the same "allow anyone" access but without the expiry, so use it only on the understanding that anyone who gets hold of this Project ID can read/write this data — there's no login check. For a factory floor tool on a private/known network that's usually an acceptable trade-off, but it is <b>not</b> the same as real access control. If you want actual logins enforced (so only your team's accounts can write), that needs Firebase Authentication wired into the app — a bigger follow-up change, ask for it separately if you want it.<br>
        <code style="display:block; white-space:pre-wrap; margin-top:6px;">rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /{document=**} { allow read, write: if true; }
  }
}</code>
      </div>

      ${['SAILY','J177','E125'].map(p=>`
        <h3 style="margin:16px 0 8px;">${PLANTS[p].label}</h3>
        ${urlField(p,'beam')}
        ${urlField(p,'grey')}
      `).join('')}
      <div class="btn-row" style="margin-top:16px;">
        <button class="btn btn-outline" onclick="this.closest('.modal-bg').remove()">Close</button>
        <button class="btn btn-primary" onclick="saveSapSettings()">Save</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
}

async function saveSapSettings(){
  if (!(await requireAdmin())) return;
  const scriptUrl = document.getElementById('sap_scripturl').value.trim();
  if(!scriptUrl){ toast('Add the Apps Script Web App URL first', true); return; }

  const sheets = { scriptUrl };
  for(const p of ['SAILY','J177','E125']){
    sheets[p] = {
      beamUrl: document.getElementById(`sap_${p}_beam`).value.trim(),
      greyUrl: document.getElementById(`sap_${p}_grey`).value.trim(),
    };
  }
  await setSapSheets(sheets);
  Object.keys(__sapMemCache).forEach(k=>delete __sapMemCache[k]);

  const pidInput = document.getElementById('firebase_pid');
  const pid = pidInput ? pidInput.value.trim() : '';
  setFirebaseProjectIdSync(pid);

  toast(pid ? 'Saved — shared backend active for this device' : 'SAP sheet links saved');

/* ---------- generic record helpers ---------- */
async function loadAll(prefix, shared=true){
  const res = await Storage.list(prefix, shared);
  const keys = (res && res.keys) || [];
  const out = [];
  const CHUNK = 25; // fetch in parallel batches rather than one key at a time
  for(let i=0;i<keys.length;i+=CHUNK){
    const batch = keys.slice(i, i+CHUNK);
    const recs = await Promise.all(batch.map(k=>Storage.get(k, shared)));
    recs.forEach((rec, idx)=>{
      if(rec){ try{ const obj = JSON.parse(rec.value); obj.__storageKey = batch[idx]; obj.__storageShared = shared; out.push(obj); }catch(e){} }
    });
  }
  return out;
}
async function deleteByStorageKey(r){
  if(r && r.__storageKey){ await Storage.delete(r.__storageKey, !!r.__storageShared); }
}

/* =========================================================
   ROUTER
   Hash formats:
     #/home                                -> plant picker
     #/plant/SAILY                         -> plant menu (weaving/warping)
     #/plant/SAILY/weaving                 -> weaving submenu
     #/plant/SAILY/weaving/scan-new-beam   -> a form/screen
     #/plant/SAILY/warping/...             -> warping screens
   ========================================================= */
const plantRoutes = {};
window.addEventListener('hashchange', render);

function go(path){ location.hash = '#/'+path; }

function parseHash(){
  const raw = (location.hash || '#/home').slice(2);
  const parts = raw.split('/').filter(Boolean);
  if(parts[0] === 'plant'){
    return { plant: parts[1], sub: parts.slice(2).join('/') || 'menu' };
  }
  return { plant: null, sub: parts.join('/') || 'home' };
}

function render(){
  const { plant, sub } = parseHash();
  if(!plant || !PLANTS[plant]){
    currentPlant = null;
    applyTheme(null);
    routeHome();
    return;
  }
  currentPlant = plant;
  applyTheme(plant);
  const handler = plantRoutes[sub] || plantRoutes['menu'];
  handler(plant);
}

let __scannerInstance = null;
function openBarcodeScanner(inputId, opts={}){
  if(typeof Html5Qrcode === 'undefined'){
    toast('Camera scanner needs an internet connection to load — scan straight into the field instead.', true);
    return;
  }
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">

      <p>Hold the barcode steady inside the frame.</p>
      <div id="scanRegion" class="scan-region"></div>
      <button class="btn btn-outline" style="margin-top:14px;" onclick="closeBarcodeScanner()">Cancel</button>
    </div>`;
  document.body.appendChild(bg);

  __scannerInstance = new Html5Qrcode('scanRegion');
  __scannerInstance.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 260, height: 130 } },
    (decodedText) => {
      const el = document.getElementById(inputId);
      if(el){ el.value = decodedText.trim(); }
      closeBarcodeScanner();
      if(opts.advanceTo){ const next = document.getElementById(opts.advanceTo); if(next) next.focus(); }
      if(opts.onScanned && typeof window[opts.onScanned] === 'function'){ window[opts.onScanned](); }
    },
    () => { /* ignore per-frame decode misses */ }
  ).catch(() => {
    toast('Could not start camera — check camera permission for this page.', true);
    closeBarcodeScanner();
  });
}
function closeBarcodeScanner(){
  const bg = document.querySelector('.modal-bg');
  if(__scannerInstance){
    __scannerInstance.stop().then(()=>__scannerInstance.clear()).catch(()=>{});
    __scannerInstance = null;
  }
  if(bg) bg.remove();
}
